<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TempMate | Temperature Converter</title>

    <link rel="stylesheet" href="temp-style.css">
</head>

<body>

    <main class="converter-wrapper">

        <div class="heading">
            <span class="icon">🌡️</span>
            <h1>TempMate</h1>
            <p>Quick and simple temperature conversion</p>
        </div>

        <div class="converter-card">

            <label for="tempInput">Temperature</label>

            <input
                type="number"
                id="tempInput"
                placeholder="Enter temperature"
            >

            <div class="unit-section">

                <div>
                    <label for="inputUnit">From</label>

                    <select id="inputUnit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <div>
                    <label for="outputUnit">To</label>

                    <select id="outputUnit">
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="celsius">Celsius (°C)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

            </div>

            <button id="convertBtn">
                Convert Now
            </button>

            <div id="result" class="result">
                Enter a value to see the result.
            </div>

        </div>

    </main>

    <footer>
        <p>Web Development & Designing • Level 1 Task 3</p>
    </footer>

    <script src="temp-script.js"></script>

</body>

</html>
